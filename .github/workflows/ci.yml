name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (CPU torch)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Test (synthetic data, CPU)
        run: uv run pytest -q
        env:
          WANDB_MODE: disabled
